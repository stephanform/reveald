<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --panel:#0a0a0a;
    --line-strong: rgba(224,224,224,0.9);
    --ink-primary:#e9e9e9;
    --ink-secondary:#a9a9a9;
    --ink-muted:#6f6f6f;
    --hairline: rgba(200,200,200,0.14);
    --dot: 205,205,205;
    --focus-ring: #f2f2f2;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--ink-primary);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    overflow:hidden;
  }
  body{ display:flex; flex-direction:column; }

  header{
    flex:0 0 auto;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    padding:18px 22px 14px;
    border-bottom:1px solid var(--hairline);
    background:linear-gradient(to bottom, rgba(255,255,255,0.02), rgba(255,255,255,0));
  }
  .title-block h1{
    margin:0 0 4px;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--ink-primary);
    text-wrap:balance;
  }
  .title-block .sub{
    margin:0;
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:11.5px;
    color:var(--ink-muted);
    letter-spacing:0.01em;
  }
  .title-block .sub b{ color:var(--ink-secondary); font-weight:500; }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
  }
  .controls label{
    font-family:"IBM Plex Mono", monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-muted);
    margin-right:2px;
  }
  #countryFilter{
    background:#0e0e0e;
    border:1px solid rgba(200,200,200,0.28);
    color:var(--ink-primary);
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    padding:6px 10px;
    border-radius:3px;
    width:190px;
    outline:none;
  }
  #countryFilter::placeholder{ color:#5a5a5a; }
  #countryFilter:focus{ border-color: var(--focus-ring); }
  #clearFilter{
    background:transparent;
    border:1px solid rgba(200,200,200,0.28);
    color:var(--ink-secondary);
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:3px;
    cursor:pointer;
  }
  #clearFilter:hover{ border-color:var(--focus-ring); color:var(--ink-primary); }
  #clearFilter:focus-visible, #countryFilter:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:1px; }

  main{
    position:relative;
    flex:1 1 auto;
    min-height:0;
  }
  #scene{ display:block; width:100%; height:100%; cursor:grab; }
  #scene.dragging{ cursor:grabbing; }

  #tooltip{
    position:absolute;
    pointer-events:none;
    background:rgba(8,8,8,0.92);
    border:1px solid rgba(210,210,210,0.35);
    color:var(--ink-primary);
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px;
    line-height:1.5;
    padding:8px 10px;
    border-radius:3px;
    transform:translate(-50%,-110%);
    white-space:nowrap;
    opacity:0;
    transition:opacity 0.08s ease;
    z-index:5;
    box-shadow:0 4px 18px rgba(0,0,0,0.6);
  }
  #tooltip .co{ color:var(--ink-primary); font-weight:600; }
  #tooltip .meta{ color:var(--ink-muted); }
  #tooltip .score{ color:#f4f4f4; font-weight:600; }

  footer{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 22px;
    border-top:1px solid var(--hairline);
    font-family:"IBM Plex Mono", monospace;
    font-size:10.5px;
    color:var(--ink-muted);
    letter-spacing:0.02em;
  }
  footer span b{ color:var(--ink-secondary); font-weight:500; }

  @media (prefers-reduced-motion: reduce){
    * { transition:none !important; }
  }
</style>

<header>
  <div class="title-block">
    <h1>ESG Score Field</h1>
    <p class="sub">y &mdash; <b>ESG score</b> (0&ndash;100)&nbsp;&nbsp;·&nbsp;&nbsp;x &mdash; <b>fiscal year</b> (FY0 &rarr; FY&minus;3)&nbsp;&nbsp;·&nbsp;&nbsp;z &mdash; <b>country of headquarters</b> (<span id="countryCount"></span> categories)</p>
  </div>
  <div class="controls">
    <label for="countryFilter">Isolate</label>
    <input id="countryFilter" type="text" list="countryList" placeholder="country&hellip;" autocomplete="off" spellcheck="false" />
    <datalist id="countryList"></datalist>
    <button id="clearFilter" type="button">Reset</button>
  </div>
</header>

<main>
  <canvas id="scene"></canvas>
  <div id="tooltip"></div>
</main>

<footer>

</footer>

  let radius = 780;
  const RADIUS_MIN = 260, RADIUS_MAX = 2200;

  let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

  function resize(){
    const main = document.querySelector('main');
    const w = main.clientWidth, h = main.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  window.addEventListener('resize', resize);

  function cameraBasis(){
    const cp = pitch, cy = yaw;
    const camPos = {
      x: target.x + radius * Math.cos(cp) * Math.sin(cy),
      y: target.y + radius * Math.sin(cp),
      z: target.z + radius * Math.cos(cp) * Math.cos(cy)
    };
    let fwd = { x: target.x - camPos.x, y: target.y - camPos.y, z: target.z - camPos.z };
    const flen = Math.hypot(fwd.x, fwd.y, fwd.z);
    fwd = { x: fwd.x/flen, y: fwd.y/flen, z: fwd.z/flen };
    const worldUp = { x:0, y:1, z:0 };
    let right = {
      x: fwd.y*worldUp.z - fwd.z*worldUp.y,
      y: fwd.z*worldUp.x - fwd.x*worldUp.z,
      z: fwd.x*worldUp.y - fwd.y*worldUp.x
    };
    const rlen = Math.hypot(right.x, right.y, right.z) || 1;
    right = { x:right.x/rlen, y:right.y/rlen, z:right.z/rlen };
    const up = {
      x: right.y*fwd.z - right.z*fwd.y,
      y: right.z*fwd.x - right.x*fwd.z,
      z: right.x*fwd.y - right.y*fwd.x
    };
    return { camPos, fwd, right, up };
  }

  function project(p, basis, cw, ch, focal){
    const rel = { x:p.x-basis.camPos.x, y:p.y-basis.camPos.y, z:p.z-basis.camPos.z };
    const cx = rel.x*basis.right.x + rel.y*basis.right.y + rel.z*basis.right.z;
    const cyv = rel.x*basis.up.x + rel.y*basis.up.y + rel.z*basis.up.z;
    const cz = rel.x*basis.fwd.x + rel.y*basis.fwd.y + rel.z*basis.fwd.z;
    if (cz <= 1) return null;
    const sx = cw/2 + (cx/cz) * focal;
    const sy = ch/2 - (cyv/cz) * focal;
    return { sx, sy, depth: cz };
  }

  // ---------- interaction state ----------
  let dragging = false, lastMX = 0, lastMY = 0;
  let hoverPt = null;
  let mouseCSSX = -9999, mouseCSSY = -9999;
  let filterQuery = '';

  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    lastMX = e.clientX; lastMY = e.clientY;
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup', e => {
    dragging = false;
    canvas.classList.remove('dragging');
  });
  canvas.addEventListener('pointercancel', () => { dragging = false; canvas.classList.remove('dragging'); });
  canvas.addEventListener('pointermove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseCSSX = e.clientX - rect.left;
    mouseCSSY = e.clientY - rect.top;
    if (dragging){
      const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
      lastMX = e.clientX; lastMY = e.clientY;
      yaw += dx * 0.006;
      pitch += dy * 0.006;
      const lim = 1.45;
      pitch = Math.max(-lim, Math.min(lim, pitch));
    }
    scheduleRender();
  });
  canvas.addEventListener('pointerleave', () => {
    mouseCSSX = -9999; mouseCSSY = -9999;
    hoverPt = null;
    scheduleRender();
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = Math.exp(e.deltaY * 0.0016);
    radius = Math.max(RADIUS_MIN, Math.min(RADIUS_MAX, radius * factor));
    scheduleRender();
  }, { passive:false });

  // basic pinch-to-zoom for touch
  let pinchDist = null;
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2){
      e.preventDefault();
      const [a,b] = e.touches;
      const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      if (pinchDist != null){
        const factor = pinchDist / d;
        radius = Math.max(RADIUS_MIN, Math.min(RADIUS_MAX, radius * factor));
        scheduleRender();
      }
      pinchDist = d;
    }
  }, { passive:false });
  canvas.addEventListener('touchend', () => { pinchDist = null; });

  const filterInput = document.getElementById('countryFilter');
  const clearBtn = document.getElementById('clearFilter');
  filterInput.addEventListener('input', () => {
    filterQuery = filterInput.value.trim().toLowerCase();
    scheduleRender();
  });
  clearBtn.addEventListener('click', () => {
    filterInput.value = '';
    filterQuery = '';
    scheduleRender();
  });

  let matchedCountryIdx = null;
  function computeFilterMatch(){
    if (!filterQuery){ matchedCountryIdx = null; return; }
    const idx = new Set();
    countries.forEach((c, i) => { if (c.toLowerCase().includes(filterQuery)) idx.add(i); });
    matchedCountryIdx = idx;
  }

  // ---------- render ----------
  const tooltip = document.getElementById('tooltip');
  let projectedCache = [];
  let rafPending = false;
  function scheduleRender(){
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; render(); });
  }

  function render(){
    computeFilterMatch();
    const cw = canvas.width, ch = canvas.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cw,ch);
    ctx.save();
    ctx.scale(dpr, dpr);
    const cssW = cw / dpr, cssH = ch / dpr;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0,0,cssW,cssH);

    const basis = cameraBasis();
    const focal = cssH * 1.15 * (780/radius) * 0 + cssH * 1.05; // focal tied to viewport, fov roughly fixed
    const FOCAL = cssH * 1.1;

    // ---- floor: per-country category lines (z-axis categories) ----
    const activeAlphaLo = matchedCountryIdx ? 0.05 : 0.16;
    const activeAlphaHi = 1;
    for (let ci = 0; ci < countries.length; ci++){
      const z = worldZ(ci);
      const a3 = project({x:X_MIN, y:0, z}, basis, cssW, cssH, FOCAL);
      const b3 = project({x:X_MAX, y:0, z}, basis, cssW, cssH, FOCAL);
      if (!a3 || !b3) continue;
      const isMatch = matchedCountryIdx && matchedCountryIdx.has(ci);
      ctx.strokeStyle = isMatch ? 'rgba(240,240,240,0.85)' : `rgba(190,190,190,${activeAlphaLo})`;
      ctx.lineWidth = isMatch ? 1.4 : 0.6;
      ctx.beginPath();
      ctx.moveTo(a3.sx, a3.sy);
      ctx.lineTo(b3.sx, b3.sy);
      ctx.stroke();
    }

    // ---- floor: per-FY gridlines (x-axis categories), dimmer ----
    for (let fi = 0; fi < fyLabels.length; fi++){
      const x = worldX(fi);
      const a3 = project({x, y:0, z:Z_MIN}, basis, cssW, cssH, FOCAL);
      const b3 = project({x, y:0, z:Z_MAX}, basis, cssW, cssH, FOCAL);
      if (!a3 || !b3) continue;
      ctx.strokeStyle = 'rgba(190,190,190,0.09)';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(a3.sx, a3.sy);
      ctx.lineTo(b3.sx, b3.sy);
      ctx.stroke();
    }

    // ---- y-axis (ESG score) ruler at front-left corner ----
    const rulerX = X_MIN, rulerZ = Z_MAX;
    const yTicks = [0,25,50,75,100];
    const axisBottom = project({x:rulerX, y:0, z:rulerZ}, basis, cssW, cssH, FOCAL);
    const axisTop = project({x:rulerX, y:300, z:rulerZ}, basis, cssW, cssH, FOCAL);
    if (axisBottom && axisTop){
      ctx.strokeStyle = 'rgba(210,210,210,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(axisBottom.sx, axisBottom.sy);
      ctx.lineTo(axisTop.sx, axisTop.sy);
      ctx.stroke();
    }
    ctx.font = '10.5px "IBM Plex Mono", monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    yTicks.forEach(score => {
      const p3 = project({x:rulerX, y:worldY(score), z:rulerZ}, basis, cssW, cssH, FOCAL);
      if (!p3) return;
      ctx.fillStyle = 'rgba(200,200,200,0.16)';
      const tick2 = project({x:rulerX-8, y:worldY(score), z:rulerZ}, basis, cssW, cssH, FOCAL);
      if (tick2){
        ctx.strokeStyle = 'rgba(200,200,200,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(p3.sx, p3.sy); ctx.lineTo(tick2.sx, tick2.sy); ctx.stroke();
        ctx.fillStyle = 'rgba(160,160,160,0.75)';
        ctx.fillText(String(score), tick2.sx - 4, tick2.sy);
      }
    });

    // ---- FY (x) labels along the front edge ----
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = '600 11px "IBM Plex Mono", monospace';
    for (let fi=0; fi<fyLabels.length; fi++){
      const p3 = project({x:worldX(fi), y:-14, z:Z_MAX+34}, basis, cssW, cssH, FOCAL);
      if (!p3) continue;
      ctx.fillStyle = 'rgba(210,210,210,0.55)';
      ctx.fillText(fyLabels[fi], p3.sx, p3.sy);
    }

    // ---- country (z) labels along left edge ----
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let ci=0; ci<countries.length; ci++){
      const p3 = project({x:X_MIN-14, y:0, z:worldZ(ci)}, basis, cssW, cssH, FOCAL);
      if (!p3) continue;
      const isMatch = matchedCountryIdx && matchedCountryIdx.has(ci);
      const scale = Math.max(0.55, Math.min(1, 500/p3.depth));
      if (!isMatch && scale < 0.62 && matchedCountryIdx) continue;
      ctx.font = (isMatch ? '600 ' : '400 ') + Math.round(10.5*scale) + 'px "IBM Plex Mono", monospace';
      ctx.fillStyle = isMatch ? 'rgba(245,245,245,0.95)' : `rgba(150,150,150,${0.28*scale + (matchedCountryIdx?0.05:0.25)})`;
      ctx.fillText(countries[ci], p3.sx, p3.sy);
    }

    // ---- data points ----
    const proj = [];
    for (let i=0;i<points.length;i++){
      const p = points[i];
      const pr = project(p, basis, cssW, cssH, FOCAL);
      if (!pr) continue;
      proj.push({ sx:pr.sx, sy:pr.sy, depth:pr.depth, rec:p });
    }
    proj.sort((a,b) => b.depth - a.depth);
    projectedCache = proj;

    const isFiltering = !!matchedCountryIdx;
    for (let i=0;i<proj.length;i++){
      const q = proj[i];
      const sizeAtten = Math.max(0.55, Math.min(2.2, 900/q.depth));
      const isMatch = !isFiltering || matchedCountryIdx.has(q.rec.countryIdx);
      const r = (isMatch ? 1.9 : 1.1) * sizeAtten;
      const alpha = isMatch ? Math.min(0.92, 0.4 + sizeAtten*0.22) : 0.05;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${210},${210},${210},${alpha})`;
      ctx.arc(q.sx, q.sy, r, 0, Math.PI*2);
      ctx.fill();
    }

    // ---- hover ----
    let nearest = null, nearestD = 196; // px^2 threshold ~14px
    if (mouseCSSX > -1000){
      for (let i=0;i<proj.length;i++){
        const q = proj[i];
        const dx = q.sx - mouseCSSX, dy = q.sy - mouseCSSY;
        const d2 = dx*dx + dy*dy;
        if (d2 < nearestD){ nearestD = d2; nearest = q; }
      }
    }
    hoverPt = nearest;

    if (hoverPt){
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.4;
      ctx.arc(hoverPt.sx, hoverPt.sy, 6, 0, Math.PI*2);
      ctx.stroke();

      const rec = hoverPt.rec;
      tooltip.innerHTML =
        `<div class="co">${escapeHtml(rec.name)}</div>` +
        `<div class="meta">${escapeHtml(countries[rec.countryIdx])} &nbsp;·&nbsp; ${fyLabels[rec.fyIdx]}</div>` +
        `<div>ESG&nbsp;score&nbsp;<span class="score">${rec.score.toFixed(1)}</span></div>`;
      tooltip.style.left = hoverPt.sx + 'px';
      tooltip.style.top = hoverPt.sy + 'px';
      tooltip.style.opacity = '1';
    } else {
      tooltip.style.opacity = '0';
    }

    ctx.restore();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  resize();
  render();
  window.addEventListener('resize', () => { resize(); scheduleRender(); });
})();
</script>
